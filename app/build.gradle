plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alessandro.dreamingofthestage'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alessandro.dreamingofthestage'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        fixed {
            storeFile file('dots-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
